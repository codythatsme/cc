name: Mobile Android (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: APK for testers or production AAB for Google Play
        required: true
        type: choice
        default: preview
        options: [preview, production]
      submit:
        description: Upload production AAB to the Google Play internal track as a draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-android-eas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build and optionally submit
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          EAS_PROFILE: ${{ inputs.profile }}
          EAS_SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN is required"; exit 1; }
          args=(build --platform android --profile "$EAS_PROFILE" --non-interactive)
          if [[ "$EAS_SUBMIT" == "true" ]]; then
            [[ "$EAS_PROFILE" == "production" ]] || { echo "::error::Only production can be submitted"; exit 1; }
            test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo "::error::Google Play service account is required"; exit 1; }
            umask 077
            printf '%s\n' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
            args+=(--auto-submit)
          fi
          pnpm exec eas "${args[@]}"
