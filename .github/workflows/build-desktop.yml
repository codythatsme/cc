name: Release cc

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: "1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

concurrency:
  group: cc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize Electron before parallel tests
        run: ELECTRON_RUN_AS_NODE=1 pnpm --filter @cc/desktop exec electron --version
      - name: Check release version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            exit 1
          fi
      - run: pnpm exec turbo run typecheck --filter=@cc/desktop --filter=cc-app --concurrency=3 --output-logs=errors-only
      - run: pnpm exec turbo run test --filter=@cc/desktop --filter=cc-app --concurrency=1 --output-logs=errors-only -- --maxWorkers=3 --testTimeout=15000
      - name: Build desktop archive
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec turbo run desktop:build --filter=@cc/desktop --concurrency=3 --output-logs=errors-only
      - run: pnpm exec turbo run smoke:packaged --filter=@cc/desktop --output-logs=errors-only
      - run: pnpm --dir apps/desktop run desktop:version-feed
      - name: Prepare Homebrew cask
        run: node scripts/generate-homebrew-cask.mjs apps/desktop/release
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Version already released; preserving its immutable archives."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" apps/desktop/release/*.dmg apps/desktop/release/*.zip apps/desktop/release/*.blockmap apps/desktop/release/latest-mac.yml apps/desktop/release/desktop-version.json apps/desktop/release/cc.rb --title "cc ${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest --target "$GITHUB_SHA" --title "Latest cc desktop" --notes "Install with brew install --cask codythatsme/tap/cc. See the versioned release for notes." --prerelease
          fi
          gh release upload desktop-latest apps/desktop/release/*.dmg apps/desktop/release/*.zip apps/desktop/release/*.blockmap apps/desktop/release/latest-mac.yml apps/desktop/release/desktop-version.json --clobber
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cc-macos-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/cc.rb
