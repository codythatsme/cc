name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize Electron before parallel tests
        run: ELECTRON_RUN_AS_NODE=1 pnpm --filter @cc/desktop exec electron --version
      - run: pnpm exec turbo run build typecheck --filter=@cc/desktop --filter=cc-app --filter=@cc/config --filter=@cc/server --filter=@cc/app --concurrency=3 --output-logs=errors-only
      - name: Test
        run: pnpm exec turbo run test --filter=@cc/desktop --filter=cc-app --filter=@cc/config --filter=@cc/server --filter=@cc/app --concurrency=1 --output-logs=errors-only -- --maxWorkers=3 --testTimeout=15000
