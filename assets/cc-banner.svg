<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">cc — Your agentic workspace</title>
  <desc id="desc">The Soft Carbon cc mark on warm ivory. Local. Open source. Telemetry free.</desc>
  <rect width="1200" height="630" fill="#f1ede5"/>
  <g fill="#28292a" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="30" font-weight="700" letter-spacing="-1">cc</text>
    <text x="80" y="280" font-size="62" font-weight="600" letter-spacing="-2.7">Your agentic</text>
    <text x="80" y="351" font-size="62" font-weight="600" letter-spacing="-2.7">workspace.</text>
    <text x="82" y="414" font-size="21" fill="#71706b">Local. Open source. Telemetry free.</text>
    <text x="82" y="552" font-size="16" fill="#71706b">github.com/codythatsme/cc</text>
  </g>
  <image href="soft-carbon/mark.png" x="615" y="147" width="520" height="336" preserveAspectRatio="xMidYMid meet"/>
